name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# What CI does and does not cover:
# On every run the Hytale game jar is absent, so mod/hytale is ALWAYS EXEMPT,
# its 7 sources never compile, and checkHytaleJarVersion is onlyIf-gated off.
# CI genuinely adds: lint/format parity (Error Prone + Spotless) across all
# four modules, the guarantee that a NEW module cannot go dark undeclared, and
# checkManifestEntrypoint -- the one check that covers mod/hytale here, because
# it reads sources rather than classes and so is meaningful even though nothing
# in that module compiles on a runner.
# It does NOT detect Hytale API drift (e.g. the Vector3d package move, or a
# game jar bumping past this build's Java version). Detecting that requires
# compiling against a real game install, which no runner can do, so it happens
# only on a machine that has the game -- and nothing in THIS repository
# schedules that. If you maintain a fork, that gap is yours to cover.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Satisfies the committed foojay daemon pin (gradle/gradle-daemon-jvm.properties,
      # toolchainVersion=25 vendor=ADOPTIUM) from the runner cache instead of
      # downloading a JDK on every run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      # Runners cannot have the proprietary Hytale server jar, so mod/hytale
      # compiles zero sources here and reports EXEMPT. That gap is restated on
      # every run rather than inferred. An UNDECLARED zero-compile fails the
      # build inside ./gradlew build above.
      - name: Module coverage census
        run: python3 scripts/coverage-census.py

      - name: Test census
        run: python3 scripts/test-census.py
